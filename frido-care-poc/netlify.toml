# Standalone deploy config so this folder can live in its own repo / Netlify site.
[build]
  publish = "."

# "Ask the coach" endpoint. Needs ANTHROPIC_API_KEY in the site environment and a Git or CLI deploy
# (drag-and-drop deploys do not include functions; the app then answers safety and form questions on the device).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
